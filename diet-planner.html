<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaxMentor Diet Planner</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#1d2671,#c33764);
    color:#fff;
    padding-bottom:70px;
}

/* HEADER */
header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:60px;
    background:#000000aa;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
    z-index:1000;
}
.logo{font-size:1.4rem;font-weight:bold;}
#menuButton{
    background:#fff;
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
}

/* SIDEBAR */
nav{
    position:fixed;
    top:60px;
    right:-230px;
    width:230px;
    height:calc(100vh - 60px);
    background:#000000dd;
    backdrop-filter:blur(10px);
    padding:20px;
    transition:0.3s;
}
nav.active{right:0;}
nav a{
    display:block;
    margin-bottom:15px;
    padding:10px;
    background:#ffffff22;
    border-radius:20px;
    text-align:center;
    text-decoration:none;
    color:#fff;
}
nav a:hover{background:#ffffff44;}

/* MAIN CARD */
.container{
    max-width:900px;
    margin:100px auto 20px auto;
    background:#ffffff15;
    backdrop-filter:blur(12px);
    border-radius:16px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{text-align:center;margin-bottom:20px;}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr auto;
    gap:10px;
    margin-bottom:15px;
}

select,input,button{
    padding:10px;
    border:none;
    border-radius:8px;
}

button{
    background:#fff;
    cursor:pointer;
}

.download-btn{
    width:100%;
    margin-bottom:15px;
}

table{
    width:100%;
    border-collapse:collapse;
}
th,td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #ffffff30;
}
.remove{color:#ff4d4d;cursor:pointer;font-weight:bold;}

/* FOOTER */
footer{
    position:fixed;
    bottom:0;
    width:100%;
    text-align:center;
    padding:12px;
    background:#000000aa;
}
footer a{color:#fff;text-decoration:none;}

/* POPUP */
.popup{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
    z-index:2000;
}
.popup-content{
    background:#fff;
    color:#333;
    padding:25px;
    border-radius:16px;
    width:90%;
    max-width:400px;
    text-align:center;
    position:relative;
    animation:fadeIn .3s ease;
}
.popup img{
    width:100%;
    border-radius:12px;
    margin:15px 0;
}
.close{
    position:absolute;
    top:10px;
    right:15px;
    cursor:pointer;
}
@keyframes fadeIn{
    from{transform:scale(.8);opacity:0;}
    to{transform:scale(1);opacity:1;}
}

@media(max-width:768px){
    .form-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<header>
    <div class="logo">MaxMentor</div>
    <button id="menuButton">☰</button>
</header>

<nav id="sidebar">
    <a href="#" onclick="openPopup()">☕ Buy Me Coffee</a>
    <a href="https://t.me/maxmentor" target="_blank">📢 Telegram</a>
</nav>

<div class="container">
<h1>Diet Planner</h1>

<div class="form-row">
<select id="mealType">
<option value="">Select Meal</option>
<option>Breakfast</option>
<option>Lunch</option>
<option>Dinner</option>
<option>Snack</option>
</select>
<input type="text" id="foodItem" placeholder="Food Item">
<input type="number" id="calories" placeholder="Calories (Optional)">
<button onclick="addRow()">Add</button>
</div>

<button class="download-btn" onclick="downloadPDF()">Download Stylish PDF</button>

<table>
<thead>
<tr>
<th>Meal</th>
<th>Food</th>
<th>Calories</th>
<th>Remove</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<footer>
© 2025 <a href="https://t.me/maxmentor" target="_blank">MaxMentor</a>
</footer>

<!-- POPUP -->
<div id="coffeePopup" class="popup">
<div class="popup-content">
<span class="close" onclick="closePopup()">✖</span>
<h2>Support MaxMentor ☕</h2>
<img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgptkv3jQ_6-j04xccfauZk30RcO1LjvMbU-OyDiyLTM6LOkNGJyDutYjgPO0rGF9b_UUFk6I6AjEX_2hjRLjjVIrJFO9XHyPKXWE-6apCJq9NDaQcPwJki2eB2Znp7jwzXzak84nTlubAb1Irvq9JDV5O0i8V7d4O-vyYDONvhlCERgsfpQZuibflEpGw/s320/UPI.jpg">
<p><a href="https://t.me/maxmentor" target="_blank">https://t.me/maxmentor</a></p>
</div>
</div>

<script>
const menuButton=document.getElementById('menuButton');
const sidebar=document.getElementById('sidebar');
menuButton.addEventListener('click',()=>{sidebar.classList.toggle('active');});

function openPopup(){
document.getElementById("coffeePopup").style.display="flex";
}
function closePopup(){
document.getElementById("coffeePopup").style.display="none";
}

function addRow(){
let meal=document.getElementById("mealType").value;
let food=document.getElementById("foodItem").value;
let cal=document.getElementById("calories").value;
if(!meal||!food) return alert("Fill required fields");

let tr=document.createElement("tr");
tr.innerHTML=`
<td>${meal}</td>
<td>${food}</td>
<td>${cal||0}</td>
<td class="remove" onclick="this.parentElement.remove()">✖</td>
`;
document.getElementById("tableBody").appendChild(tr);
document.getElementById("foodItem").value="";
document.getElementById("calories").value="";
}

/* ===== PREMIUM PDF ===== */
function downloadPDF(){

let rows=document.querySelectorAll("#tableBody tr");
if(rows.length===0) return alert("No data");

const { jsPDF }=window.jspdf;
let doc=new jsPDF("p","mm","a4");

let totalCalories=0;
let today=new Date().toLocaleDateString();

/* HEADER */
doc.setFillColor(29,38,113);
doc.rect(0,0,210,35,"F");
doc.setTextColor(255,255,255);
doc.setFontSize(22);
doc.text("DIET PLANNER REPORT",105,18,{align:"center"});
doc.setFontSize(12);
doc.text("Generated on: "+today,105,28,{align:"center"});

/* TABLE HEADER */
let startY=45;
doc.setFillColor(195,55,100);
doc.rect(10,startY,190,12,"F");
doc.setTextColor(255,255,255);
doc.text("Meal",20,startY+8);
doc.text("Food Item",85,startY+8);
doc.text("Calories",165,startY+8);

doc.setTextColor(0,0,0);
let y=startY+18;

rows.forEach((row,index)=>{
let cols=row.querySelectorAll("td");
let cal=parseInt(cols[2].innerText)||0;
totalCalories+=cal;

if(index%2===0){
doc.setFillColor(240,240,240);
doc.rect(10,y-6,190,10,"F");
}

doc.text(cols[0].innerText,20,y);
doc.text(cols[1].innerText,85,y);
doc.text(cols[2].innerText,165,y);

y+=10;

if(y>280){
doc.addPage();
y=20;
}
});

/* TOTAL */
doc.setFontSize(14);
doc.text("Total Calories: "+totalCalories,20,y+10);

/* FOOTER */
doc.setFontSize(10);
doc.setTextColor(120);
doc.text("MaxMentor | https://t.me/maxmentor",105,290,{align:"center"});

doc.save("MaxMentor_Diet_Plan.pdf");
}
</script>

</body>
</html>
