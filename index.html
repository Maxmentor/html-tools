<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAXTOOLS</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Segoe UI', sans-serif;
}

body{
  min-height:100vh;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:40px 20px;
}

/* Heading */
h1{
  font-size:3rem;
  margin-bottom:40px;
  color:white;
  letter-spacing:2px;
  text-align:center;
  text-shadow:0 5px 15px rgba(0,0,0,0.4);
}

/* Grid Container */
.tools-grid{
  width:100%;
  max-width:1100px;
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
  gap:25px;
}

/* Premium Card Button */
.tool-card{
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  border-radius:18px;
  padding:25px;
  text-align:center;
  color:white;
  font-size:1.1rem;
  font-weight:600;
  text-decoration:none;
  transition: all 0.3s ease;
  border:1px solid rgba(255,255,255,0.2);
  position:relative;
  overflow:hidden;
}

/* Glow Effect */
.tool-card::before{
  content:"";
  position:absolute;
  width:150%;
  height:150%;
  background:linear-gradient(45deg,#00f5a0,#00d9f5,#9b00ff);
  top:-50%;
  left:-50%;
  opacity:0;
  transition:0.5s;
  transform:rotate(25deg);
}

.tool-card:hover::before{
  opacity:0.15;
}

.tool-card:hover{
  transform:translateY(-8px) scale(1.05);
  box-shadow:0 20px 40px rgba(0,0,0,0.5);
}

/* Responsive Text */
@media(max-width:768px){
  h1{
    font-size:2.2rem;
  }
}

@media(max-width:480px){
  h1{
    font-size:1.8rem;
  }
}
</style>
</head>
<body>

<h1>MAXTOOLS</h1>

<div class="tools-grid">
  <a href="./diet-planner.html" class="tool-card">Diet Planner</a>
  <a href="./Calculator.html" class="tool-card">Calculator</a>
  <a href="./Currency-Converter.html" class="tool-card">Currency Calculator</a>
  <a href="./Decode-Encode.html" class="tool-card">Decode & Encode</a>
  <a href="./hlsplayer.html" class="tool-card">HLS Player</a>
  <a href="./Html-editor.html" class="tool-card">HTML/PHP Editor</a>
  <a href="./iptvpro.html" class="tool-card">IPTV PRO</a>
  <a href="./Key-Generate.html" class="tool-card">Key Generator</a>
  <a href="./m3u-maker.html" class="tool-card">M3U Maker</a>
  <a href="./Notepad.html" class="tool-card">Notepad</a>
  <a href="./Scientific-Calculator.html" class="tool-card">Scientific Calculator</a>
  <a href="./dailytimetable.html" class="tool-card">Daily Time Table</a>
  <a href="./xtreamcode-m3u.html" class="tool-card">Xtream To M3U</a>
  <a href="./SpeedTest.html" class="tool-card">Speed Test</a>
</div>

</body>
</html>
